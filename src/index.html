<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="shortcut icon"
      href="./assets/image/logo.ico"
      type="image/x-icon"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clash Verge</title>
    <style>
      :root {
        --bg-color: #f5f5f5;
        --text-color: #333;
        color-scheme: light;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg-color: #2e303d;
          --text-color: #ffffff;
          color-scheme: dark;
        }
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        color: var(--text-color);
      }

      #root {
        width: 100%;
        height: 100%;
      }

      #initial-loading-overlay {
        position: fixed;
        inset: 0;
        background: var(--bg-color);
        z-index: 9999;
        transition: opacity 0.2s ease-out;
      }

      #initial-loading-overlay[data-hidden='true'] {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="initial-loading-overlay"></div>
    <div id="root"></div>
    <script>
      if (!window.__TAURI_INTERNALS__) {
        const callbacks = new Map();
        let nextCallbackId = 1;
        window.__TAURI_INTERNALS__ = {
          metadata: {
            currentWindow: { label: 'main' },
            currentWebview: { windowLabel: 'main', label: 'main' },
          },
          invoke: async (cmd, args) => {
            if (cmd === 'plugin:window|is_maximized') return false;
            if (cmd === 'plugin:window|is_visible') return true;
            if (cmd === 'plugin:window|is_focused') return true;
            if (cmd === 'plugin:window|is_decorated') return false;
            if (cmd === 'plugin:window|theme') return 'dark';
            if (cmd === 'get_verge_config') {
              return {
                theme_mode: 'dark',
                language: 'en',
                tv_mode: 'always',
              };
            }
            if (cmd === 'get_sys_proxy') return { enable: false };
            if (cmd === 'get_profiles') {
              return {
                current: 'default',
                items: [
                  {
                    uid: 'default',
                    name: 'Default Profile',
                    type: 'remote',
                    file: 'default.yaml',
                    selected: [],
                  },
                ],
              };
            }
            if (cmd === 'get_clash_info') return { port: 7890, socks_port: 7891, mixed_port: 7890 };
            if (cmd === 'get_runtime_state') {
              return {
                mode: 'Sidecar',
                service: 'running',
                serviceUnavailableReason: null,
                pendingAction: null,
                sidecarAllowed: true,
                isAdmin: false,
                opInFlight: false,
                serviceUsable: true,
                tunCapable: true,
                serviceNeedsAttention: false,
              };
            }
            if (cmd === 'get_system_proxy') return { enable: false };
            if (cmd === 'get_app_uptime') return 123456;
            return null;
          },
          transformCallback: (callback, once) => {
            const id = nextCallbackId++;
            callbacks.set(id, (data) => {
              if (once) callbacks.delete(id);
              callback && callback(data);
            });
            return id;
          },
          unregisterCallback: (id) => {
            callbacks.delete(id);
          },
          runCallback: (id, data) => {
            const cb = callbacks.get(id);
            if (cb) cb(data);
          },
          callbacks,
          convertFileSrc: (path) => path,
          plugins: {
            path: { sep: '/', delimiter: ':' },
          },
        };
        window.__TAURI_EVENT_PLUGIN_INTERNALS__ = {
          unregisterListener: (event, id) => {
            callbacks.delete(id);
          },
        };
      }
    </script>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
